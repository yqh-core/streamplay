<script id="dd-theme-toggle-script">
(function(){
  var KEY='dd-theme';
  function sysDark(){return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;}
  function apply(t){var h=document.documentElement;
    if(t==='dark'){h.setAttribute('data-theme','dark');h.removeAttribute('data-dd-auto');}
    else if(t==='light'){h.setAttribute('data-theme','light');h.removeAttribute('data-dd-auto');}
    else{h.removeAttribute('data-theme');h.setAttribute('data-dd-auto','');}
    try{localStorage.setItem(KEY,t);}catch(e){}
    sync();}
  function effective(){var h=document.documentElement;
    if(h.getAttribute('data-theme')==='dark')return 'dark';
    if(h.getAttribute('data-theme')==='light')return 'light';
    return sysDark()?'dark':'light';}
  function sync(){var b=document.getElementById('dd-theme-toggle');if(!b)return;
    var d=effective()==='dark';
    b.textContent=d?'☀️':'🌙';
    b.setAttribute('aria-label', d?'切换到浅色模式':'切换到深色模式');
    b.setAttribute('title', d?'切换到浅色模式':'切换到深色模式');}
  function toggle(){var c=effective();apply(c==='dark'?'light':'dark');}
  function init(){var b=document.getElementById('dd-theme-toggle');if(b)b.addEventListener('click',toggle);sync();}
  if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
  if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
    try{if(localStorage.getItem(KEY))return;}catch(e){} sync();});}
})();
</script>
