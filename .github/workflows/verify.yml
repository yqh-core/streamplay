name: verify

# 只做质量门禁，不负责发布。
# 发布由 .github/workflows/deploy-cloudflare-pages.yml 负责，两条链路职责不重叠。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # G2（B 型 dd-i18n 站）：与 ip / fangdai 同一份执行器。
      # 本仓此前没有任何 locale 检查，也没有 scripts/ 目录。
      - name: 校验 locale 配平（G2）
        run: node scripts/check-locales.mjs

      - name: Mobile cross-site navigation scroll affordance regression
        run: node --test tests/shell-mobile-nav.test.mjs

      - name: M3U8 analyzer EN/ZH runtime regression
        run: node scripts/test-m3u8-i18n-runtime.mjs

      - name: Visible copy and FAQ structured-data regression
        run: node scripts/test-copy-quality.mjs

      # G-ASSET-VER：_headers 已把 /js/*.js 与 /libs/*.js 设成一年 immutable，
      # 长缓存只在「内容变→URL 变」时安全，故每个长缓存路径引用必须带 ?v=<内容哈希前8位>。
      # 改了 JS 忘 bump 版本 = 回访用户拿旧内容一年，这里判红拦住。退出码 2 = 扫描覆盖自证失败（UNDECIDED）。
      - name: M3U8 production parser regression
        run: node scripts/test-m3u8-parser.mjs

      - name: Player parser load guard regression
        run: node scripts/test-player-parser-guard.mjs

      - name: 静态资源版本串门禁（G-ASSET-VER）
        run: node scripts/check-asset-versioning.mjs

      - name: 静态资源版本串门禁自证（G-ASSET-VER --falsify）
        run: node scripts/check-asset-versioning.mjs --falsify

      - name: GA4 consent 静态门禁（ID / 页面覆盖 / 隐私边界）
        run: node scripts/check-ga4-consent.mjs

      - name: GA4 consent 运行时回归（同意 / 拒绝 / noindex / 撤回）
        run: node scripts/test-ga4-consent-runtime.mjs

      # SEO regression guard: crawlers must receive English metadata in the original HTML,
      # rather than depending on the runtime locale script to replace a Chinese fallback.
      - name: SEO homepage English source HTML gate (metadata + structured data)
        run: |
          set -euo pipefail
          grep -Fq '<html lang="en" data-i18n-page="home">' index.html
          grep -Fq '<title>M3U8 &amp; HLS Player — Analyze, Play &amp; Embed | StreamPlay</title>' index.html
          grep -Fq 'name="description" content="Play M3U8/HLS streams or MP4 URLs in your browser. Inspect playlists, diagnose CORS and codec issues, and create iframe embeds—no plugin required.' index.html
          grep -Fq 'property="og:locale" content="en_US"' index.html
          grep -Fq '"inLanguage": "en"' index.html
          grep -Fq '"priceCurrency": "USD"' index.html
          echo "English-first StreamPlay homepage metadata and structured data verified"


      - name: English and Chinese support-page canonical/link gate
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const origin = 'https://play.digdevbox.com';
          const routes = ['about', 'contact', 'copyright', 'docs', 'faq', 'guides', 'privacy', 'terms'];
          const files = [
            { file: 'index.html', canonical: origin + '/', lang: 'en', noindex: false },
            ...routes.map((route) => ({ file: route + '/index.html', canonical: origin + '/' + route + '/', lang: 'en', noindex: false })),
            { file: 'zh/index.html', canonical: origin + '/zh/', lang: 'zh-CN', noindex: true },
            ...routes.map((route) => ({ file: 'zh/' + route + '/index.html', canonical: origin + '/zh/' + route + '/', lang: 'zh-CN', noindex: true })),
          ];
          for (const entry of files) {
            const html = readFileSync(entry.file, 'utf8');
            const canonical = html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
            if (canonical !== entry.canonical) throw new Error(entry.file + ' canonical mismatch: ' + canonical + ' (expected ' + entry.canonical + ')');
            if (!html.includes('<html lang="' + entry.lang + '"')) throw new Error(entry.file + ' has incorrect document language');
            if (entry.noindex && !/name=["']robots["'] content=["']noindex,\s*follow["']/i.test(html)) {
              throw new Error(entry.file + ' must remain noindex, follow');
            }
            const hrefs = [...html.matchAll(/href=["']([^"']+)["']/g)].map((match) => match[1]);
            const legacyInternal = hrefs.filter((href) => {
              try {
                const url = new URL(href, origin);
                return url.origin === origin && /\.html(?:[?#].*)?$/i.test(url.pathname + url.search);
              } catch {
                return false;
              }
            });
            if (legacyInternal.length) throw new Error(entry.file + ' contains internal legacy .html links: ' + legacyInternal.join(', '));
            if (entry.file.startsWith('zh/')) {
              const localRefs = [...html.matchAll(/(?:href|src)=["']([^"']+)["']/g)].map((match) => match[1]);
              const relativeLocalRefs = localRefs.filter((ref) =>
                !/^(?:https?:|mailto:|tel:|data:)/i.test(ref) && !ref.startsWith('//') && !ref.startsWith('#') && !ref.startsWith('/')
              );
              if (relativeLocalRefs.length) {
                throw new Error(entry.file + ' contains relative local asset/link paths: ' + relativeLocalRefs.join(', '));
              }
            }
          }
          for (const route of routes) {
            const english = readFileSync(route + '/index.html', 'utf8');
            if (!english.includes('href="/zh/' + route + '/"')) throw new Error(route + ': English page is missing its direct Chinese-language link');
            const chinese = readFileSync('zh/' + route + '/index.html', 'utf8');
            if (!chinese.includes('href="/' + route + '/" lang="en"')) throw new Error(route + ': Chinese page is missing its direct English-language link');
          }
          console.log('PASS: English canonicals, noindex Chinese routes, direct language links and zero internal .html links');
          NODE
