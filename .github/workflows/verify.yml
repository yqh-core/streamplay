name: verify

# 只做质量门禁，不负责发布。
# 发布由 .github/workflows/deploy-cloudflare-pages.yml 负责，两条链路职责不重叠。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # G2（B 型 dd-i18n 站）：与 ip / fangdai 同一份执行器。
      # 本仓此前没有任何 locale 检查，也没有 scripts/ 目录。
      - name: 校验 locale 配平（G2）
        run: node scripts/check-locales.mjs

      # G-ASSET-VER：_headers 已把 /js/*.js 与 /libs/*.js 设成一年 immutable，
      # 长缓存只在「内容变→URL 变」时安全，故每个长缓存路径引用必须带 ?v=<内容哈希前8位>。
      # 改了 JS 忘 bump 版本 = 回访用户拿旧内容一年，这里判红拦住。退出码 2 = 扫描覆盖自证失败（UNDECIDED）。
      - name: 静态资源版本串门禁（G-ASSET-VER）
        run: node scripts/check-asset-versioning.mjs

      - name: 静态资源版本串门禁自证（G-ASSET-VER --falsify）
        run: node scripts/check-asset-versioning.mjs --falsify
