name: Deploy to Cloudflare Pages

# 发布链路说明（重要，改动前先读）：
#   本项目已接入 Cloudflare Pages 的 Git 集成 —— push 到 main 由 Cloudflare 自动构建发布，
#   生产地址 https://streamplay-ey1.pages.dev ，PR 会自动生成预览地址。
#   本流水线因此只做两件事：
#     verify job：每次 push / PR 都跑，卡住文件缺失、引用失效、超限文件（不碰 Cloudflare）
#     deploy job：仅手动 workflow_dispatch 时跑，用 wrangler 发布，便于临时发到其他分支环境
#   两者同时写生产环境会互相覆盖，所以 deploy 默认关闭。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 部署到哪个分支环境（默认 main，即生产）
        required: false
        default: main
        type: string

# 同一分支的并发部署只保留最新一次，避免旧提交覆盖新提交
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Cloudflare Pages 的「项目名」和「子域名」是两回事，别搞混：
  #   项目名   CF_PROJECT = streamplay          <- API / wrangler 用它定位项目
  #   子域名               = streamplay-ey1      <- 因为 streamplay.pages.dev 已被他人
  #                                                占用，CF 自动加了随机后缀
  # 用 `npx wrangler pages project list` 查到的 name 字段才是项目名。
  CF_PROJECT: streamplay
  WRANGLER_VERSION: '4'

jobs:
  # ------------------------------------------------------------------
  # 第一步：校验源码、组装部署产物
  # 这一步不碰 Cloudflare，纯粹尽早发现问题。站点是纯静态的，
  # 「构建」的实质就是把要发布的那几个文件挑出来。
  # ------------------------------------------------------------------
  verify:
    name: 校验并组装产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验站点必需文件是否齐全
        run: |
          set -euo pipefail
          required="index.html about.html css/style.css js/player.js libs/hls.min.js images/logo.ico images/logo.png images/ic-play.png"
          for f in $required; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::缺少站点必需文件"
              exit 1
            fi
          done
          echo "必需文件齐全（$(echo $required | wc -w | tr -d ' ') 个）"

      - name: 校验页面上引用的本地资源都真实存在
        run: |
          set -euo pipefail
          # 抽出 HTML 里的 src="./x" / href="./x"，以及 CSS 里的 url(./x)
          grep -rhoE '(src|href)="\./[^"]+"' index.html about.html \
            | sed -E 's/.*="\.\///; s/"$//' | sort -u > /tmp/refs.txt
          grep -rhoE 'url\(\./[^)]+\)' css/style.css \
            | sed -E 's/^url\(\.\///; s/\)$//' >> /tmp/refs.txt || true

          fail=0
          while IFS= read -r r; do
            [ -z "$r" ] && continue
            if [ ! -e "$r" ]; then
              echo "::error file=$r::页面引用了不存在的文件"
              fail=1
            fi
          done < /tmp/refs.txt
          [ "$fail" -eq 0 ] || exit 1
          echo "本地引用全部有效（$(grep -c . /tmp/refs.txt | tr -d ' ') 条）"

      - name: 组装部署目录 dist
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          # 只发布站点运行必需的文件；README 等开发文件不进部署产物
          cp -r index.html about.html css js libs images dist/

          count=$(find dist -type f | wc -l | tr -d ' ')
          echo "dist 文件数: $count"
          echo "dist 体积: $(du -sh dist | cut -f1)"

          # 提前卡住 Cloudflare 的两条硬限制，避免部署到一半被拒
          if [ "$count" -gt 20000 ]; then
            echo "::error::文件数 $count 超过 Cloudflare 上限 20000"
            exit 1
          fi
          if find dist -type f -size +25M | grep -q .; then
            echo "::error::存在超过 25MiB 的单文件，Cloudflare 会拒绝上传"
            find dist -type f -size +25M
            exit 1
          fi
          echo "产物符合 Cloudflare 限制（<=20000 文件，单文件 <=25MiB）"

      - name: 上传产物供部署使用
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  # ------------------------------------------------------------------
  # 第二步：发布到 Cloudflare Pages
  #
  # 默认不跑：本项目已接 Cloudflare Git 集成，push 到 main 由 Cloudflare 自己构建发布。
  # 若这一步也跟着跑，两套部署会同时写生产环境、互相覆盖，反而分不清线上是谁的产物。
  # 只在手动 workflow_dispatch 时用 wrangler 发布（可指定部署到其他分支环境）。
  # ------------------------------------------------------------------
  deploy:
    name: 发布到 Cloudflare Pages（仅手动）
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.target.outputs.url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载部署产物
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 确定要部署的分支
        id: target
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            branch="pr-${{ github.event.number }}"
            env_name="预览"
          else
            branch="${{ github.event.inputs.branch }}"
            [ -n "$branch" ] || branch="main"
            env_name="生产"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          # Cloudflare Pages 的地址规则：
          #   生产分支（main）-> https://<项目名>.pages.dev
          #   其他分支        -> https://<分支名>.<项目名>.pages.dev
          if [ "$branch" = "main" ]; then
            url="https://${CF_PROJECT}.pages.dev"
          else
            url="https://${branch}.${CF_PROJECT}.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "将部署到${env_name}环境，分支: $branch"
          echo "预期地址: $url"

      - name: 确认 Pages 项目存在
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # 先自查凭据：没配 token 时 wrangler 只会含糊报错，不拦在这里会被误读成「项目不存在」
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::未配置 Cloudflare 凭据（两个 secret 至少有一个为空）"
            echo "到仓库 Settings > Secrets and variables > Actions > New repository secret 添加："
            echo "  CLOUDFLARE_API_TOKEN  = Cloudflare API 令牌（权限 Account / Cloudflare Pages / Edit）"
            echo "  CLOUDFLARE_ACCOUNT_ID = Cloudflare 控制台右侧边栏的 Account ID（32 位十六进制）"
            exit 1
          fi

          out=$(npx --yes wrangler@${WRANGLER_VERSION} pages project list --json 2>&1 || true)

          # 令牌无效/权限不足时，把 wrangler 的真实报错露出来
          if echo "$out" | grep -qiE 'CLOUDFLARE_API_TOKEN|authentication|not authorized|unauthorized|error code ?9109|invalid api token|could not resolve'; then
            echo "::error::Cloudflare 令牌无效、权限不足，或 Account ID 不属于该令牌"
            echo "$out" | tail -20
            exit 1
          fi

          if ! echo "$out" | tr -d ' \n' | grep -q "\"name\":\"${CF_PROJECT}\""; then
            # 刻意不自动创建：项目名写错时静默建个新项目，部署看着成功却上到了另一个域名，
            # 是最难排查的一类问题。宁可在这里失败。
            echo "::error::Cloudflare 上不存在名为 ${CF_PROJECT} 的 Pages 项目"
            echo "请核对以下两点后修正 workflow 顶部的 CF_PROJECT："
            echo "  1. 在 Cloudflare 控制台 Workers & Pages 中确认项目的真实名称"
            echo "     （pages.dev 二级域名可能被占用，Cloudflare 会自动加随机后缀，"
            echo "      如 streamplay 被占用后实际叫 streamplay-ey1）"
            echo "  2. 或运行 npx wrangler pages project list 查看"
            exit 1
          fi
          echo "项目 ${CF_PROJECT} 已存在"

      - name: 发布
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy dist \
            --project-name="${CF_PROJECT}" \
            --branch="${{ steps.target.outputs.branch }}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="$(git log -1 --pretty=%s 2>/dev/null || echo 'deploy from GitHub Actions')" \
            2>&1 | tee /tmp/deploy.log

          # 从 wrangler 输出里抓真实地址，比自己拼更可靠
          real_url=$(grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev' /tmp/deploy.log | tail -1 || true)
          [ -n "$real_url" ] || real_url="${{ steps.target.outputs.url }}"
          echo "real_url=$real_url" >> "$GITHUB_OUTPUT"
          echo "真实部署地址: $real_url"

      - name: 输出访问地址
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 环境：\`${{ steps.target.outputs.branch }}\`"
            echo "- 生产地址：https://${CF_PROJECT}.pages.dev"
            echo "- 本次部署地址：${{ steps.publish.outputs.real_url }}"
            echo "- 提交：\`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "> 生产分支（main）的部署会直接更新 https://${CF_PROJECT}.pages.dev ；"
            echo "> 其他分支的部署只在 <分支名>.${CF_PROJECT}.pages.dev 可见。"
          } >> "$GITHUB_STEP_SUMMARY"
