name: Post-deploy SEO smoke

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: read
  checks: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for the exact Cloudflare deployment, then verify Googlebot HTML
        env:
          SITE_ORIGIN: "https://play.digdevbox.com"
          LANDING_PATH: "/m3u8-player/"
          EXPECTED_TITLE: "M3U8 &amp; HLS Player"
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.SITE_ORIGIN;
          const landingPath = process.env.LANDING_PATH;
          const expectedTitle = process.env.EXPECTED_TITLE;
          const targetSha = process.env.TARGET_SHA;
          const ua = 'Googlebot/2.1 (+http://www.google.com/bot.html)';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function get(path) {
            const response = await fetch(origin + path, {
              redirect: 'follow',
              headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(10000),
            });
            return { response, body: await response.text() };
          }

          const checksUrl = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/commits/' + targetSha + '/check-runs';
          let deployed = false;
          for (let attempt = 1; attempt <= 90; attempt++) {
            const response = await fetch(checksUrl, {
              headers: {
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error('GitHub check-run API returned HTTP ' + response.status);
            const payload = await response.json();
            const check = (payload.check_runs || []).find((item) =>
              item.name === 'Cloudflare Pages' && item.head_sha === targetSha
            );
            if (check?.status === 'completed') {
              if (check.conclusion !== 'success') {
                throw new Error('Cloudflare Pages deployment concluded ' + check.conclusion +
                  ': ' + (check.details_url || 'no details URL'));
              }
              deployed = true;
              console.log('Cloudflare Pages deployment succeeded for exact commit ' + targetSha);
              break;
            }
            console.log('Waiting for exact Cloudflare deployment (' + attempt + '/90): ' +
              (check?.status || 'check not created'));
            await sleep(10000);
          }
          if (!deployed) throw new Error('Exact Cloudflare Pages deployment did not complete within 15 minutes');

          let home = null;
          for (let attempt = 1; attempt <= 20; attempt++) {
            try {
              const result = await get('/');
              const title = result.body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '';
              if (result.response.ok && result.body.includes('<html lang="en"') && title.includes(expectedTitle)) {
                home = result;
                console.log('Googlebot received the expected English homepage (attempt ' + attempt + ')');
                break;
              }
              console.log('Waiting for production HTML (' + attempt + '/20): HTTP ' +
                result.response.status + ', title="' + title + '"');
            } catch (error) {
              console.log('Waiting for production origin (' + attempt + '/20): ' + error.message);
            }
            await sleep(10000);
          }
          if (!home) throw new Error('Production homepage did not expose expected English HTML after exact deployment');
          if (!/<main\b[^>]*\bclass=["']main["']/i.test(home.body)) throw new Error('Homepage is missing its main landmark');
          for (const [id, label] of [['url', 'Stream URL'], ['sub-url', 'Subtitle URL'], ['queue-url', 'Queue stream URL'], ['ma-url', 'M3U8 playlist URL']]) {
            const input = home.body.match(new RegExp('<input\\b[^>]*id="' + id + '"[^>]*>', 'i'))?.[0] || '';
            if (!input.includes('aria-label="' + label + '"')) throw new Error(id + ' is missing its accessible name');
          }

          const csp = home.response.headers.get('content-security-policy') || '';
          if (!csp.includes("default-src 'self'") || !csp.includes("connect-src 'self' https:")) {
            throw new Error('Production CSP is missing the baseline required for secure HLS requests');
          }
          if (/\bframe-ancestors\b/i.test(csp)) {
            throw new Error('StreamPlay must remain embeddable in third-party iframes; do not restrict frame-ancestors');
          }

          if (!home.body.includes('/analytics-consent.js')) throw new Error('Homepage is missing the consent-gated GA4 loader');
          if (home.body.includes('googletagmanager.com/gtag/js')) throw new Error('GA4 must not load directly before consent');
          const gaScript = await get('/analytics-consent.js');
          if (!gaScript.response.ok || !gaScript.body.includes('G-2Y9T6LFG5W') ||
              !gaScript.body.includes("analytics_storage: 'denied'") ||
              !gaScript.body.includes('send_page_view: false') ||
              !gaScript.body.includes('Reject Google Analytics')) {
            throw new Error('Production GA4 consent script is missing, misconfigured or not consent-gated');
          }

          if (!home.body.includes('>M3U8 &amp; HLS Player</h1>')) throw new Error('English M3U8 & HLS Player H1 missing from source HTML');
          if (!home.body.includes('Paste an m3u8 / HLS or mp4 URL and hit play')) throw new Error('English StreamPlay hero description missing from source HTML');
          if (!home.body.includes('content="StreamPlay"')) throw new Error('English Open Graph site name missing');

          // The shared shell exposes one intentional bilingual language-switch control on English pages.
          // Permit only its exact, accessible "中文" label; all other visible CJK source text remains a failure.
          const languageToggle = home.body.match(/<button\b(?=[^>]*\bid=["']dd-lang-toggle["'])[^>]*>[\s\S]*?<\/button>/i);
          if (!languageToggle) throw new Error('English homepage is missing its language switch control');
          const languageToggleTag = languageToggle[0].match(/<button\b[^>]*>/i)?.[0] || '';
          const languageToggleText = languageToggle[0].replace(/<[^>]*>/g, '').trim();
          if (languageToggleText !== '中文' ||
              !/\baria-label=["']Switch language["']/i.test(languageToggleTag) ||
              !/\btitle=["']Switch language["']/i.test(languageToggleTag)) {
            throw new Error('Language switch control must retain its exact accessible English label');
          }
          const visibleHtml = home.body.replace(languageToggle[0], '').replace(/<script\b[\s\S]*?<\/script>/gi, '').replace(/<style\b[\s\S]*?<\/style>/gi, '').replace(/<!--[\s\S]*?-->/g, '');
          const cjkCount = (visibleHtml.match(/[\u3400-\u9fff]/g) || []).length;
          if (cjkCount > 0) throw new Error('English homepage source HTML contains ' + cjkCount + ' CJK characters outside scripts, styles, comments and the approved language switch');
          if (!home.body.includes('Are my stream URLs uploaded or stored?')) throw new Error('English privacy FAQ missing from source HTML');
          if (!home.body.includes('How do I inspect available renditions and audio tracks')) throw new Error('English M3U8 analyzer FAQ missing from source HTML');

          const networkLinks = [
            "https://www.digdevbox.com/",
            "https://img.digdevbox.com/",
            "https://ip.digdevbox.com/",
            "https://draw.digdevbox.com/",
            "https://ttsreader.digdevbox.com/",
            "https://notes.digdevbox.com/"
          ];
          const missingNetworkLinks = networkLinks.filter((url) => !home.body.includes(url));
          if (missingNetworkLinks.length) throw new Error('Product discovery links missing: ' + missingNetworkLinks.join(', '));
          if (/href=["']https:\/\/(?:fangdai|geek-typing)\.digdevbox\.com\//i.test(home.body)) {
            throw new Error('Deferred China-only product link remains on the English site');
          }
          if (home.body.includes('href="https://digdevbox.com/')) throw new Error('Stale bare-domain internal link remains');
          
          const canonical = home.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
          if (canonical !== origin + '/') throw new Error('Unexpected homepage canonical: ' + canonical);
          if (!home.body.includes('"inLanguage": "en"')) throw new Error('English structured-data language missing');
          if (!home.body.includes('"priceCurrency": "USD"')) throw new Error('USD offer metadata missing');
          if (!home.body.includes('How to play an HLS stream in three steps') || !home.body.includes('What is an M3U8 file?') || !home.body.includes('Which media formats does StreamPlay support?')) {
            throw new Error('English HLS instructions and FAQ are missing from source HTML');
          }
          if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(home.body)) {
            throw new Error('Homepage unexpectedly carries noindex');
          }

          const landing = await get(landingPath);
          if (!landing.response.ok) throw new Error('English landing page returned HTTP ' + landing.response.status);
          if (!landing.body.includes('<html lang="en"')) throw new Error('English landing page source lang missing');
          if (!landing.body.includes('/analytics-consent.js')) throw new Error('English landing page is missing the GA4 consent loader');
          const landingCanonical = landing.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
          if (landingCanonical !== origin + landingPath) throw new Error('Unexpected landing canonical: ' + landingCanonical);
          if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(landing.body)) {
            throw new Error('English landing page unexpectedly carries noindex');
          }

          // Keep the four main English search entry points within snippet-length
          // budgets and verify exact metadata served to Googlebot after deployment.
          const snippetPages = [
            ['/', 'M3U8 &amp; HLS Player — Analyze, Play &amp; Embed | StreamPlay'],
            ['/docs/', 'HLS &amp; M3U8 Documentation — Playlists, Tags &amp; CORS'],
            ['/guides/', 'M3U8 &amp; HLS Player Guide — Play, Embed &amp; Troubleshoot'],
            ['/m3u8-player/', 'M3U8 Player — Test HLS Streams &amp; Play MP4 | StreamPlay'],
          ];
          for (const [path, expected] of snippetPages) {
            const page = path === '/' ? home : await get(path);
            const titleStart = page.body.indexOf('<title>');
            const titleEnd = page.body.indexOf('</title>');
            const title = titleStart >= 0 && titleEnd > titleStart ? page.body.slice(titleStart + 7, titleEnd) : '';
            const description = page.body.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)["']/i)?.[1] || '';
            const canonical = page.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1] || '';
            if (!page.response.ok) throw new Error(path + ' returned HTTP ' + page.response.status);
            if (title !== expected) throw new Error(path + ' title mismatch: ' + title);
            const visibleTitleLength = title.split('&amp;').join('&').length;
            if (visibleTitleLength > 60 || visibleTitleLength < 10) throw new Error(path + ' title length outside 10–60: ' + visibleTitleLength);
            if (description.length < 50 || description.length > 160) throw new Error(path + ' description length outside 50–160: ' + description.length);
            if (canonical !== origin + path) throw new Error(path + ' has unexpected canonical: ' + canonical);
            if (!page.body.includes('<h1')) throw new Error(path + ' is missing H1');
          }

          const robots = await get('/robots.txt');
          if (!robots.response.ok || !/sitemap:\s*https:\/\//i.test(robots.body.toLowerCase()) ||
              !robots.body.toLowerCase().includes((origin + '/sitemap.xml').toLowerCase())) {
            throw new Error('robots.txt does not reference the canonical production sitemap');
          }

          let sitemap = null;
          for (let attempt = 1; attempt <= 20; attempt++) {
            const candidate = await get('/sitemap.xml');
            if (candidate.response.ok && candidate.body.includes('<urlset') &&
                candidate.body.includes(origin + landingPath)) {
              sitemap = candidate;
              console.log('Production sitemap includes the English landing page (attempt ' + attempt + ')');
              break;
            }
            console.log('Waiting for deployed sitemap (' + attempt + '/20): HTTP ' + candidate.response.status);
            await sleep(10000);
          }
          if (!sitemap) throw new Error('Production sitemap did not include the English landing page');

          // Google Search Console still reports historical no-slash URLs. Verify
          // each one issues a permanent redirect to its exact trailing-slash canonical.
          const slashRedirects = {
            '/about': '/about/',
            '/contact': '/contact/',
            '/copyright': '/copyright/',
            '/docs': '/docs/',
            '/faq': '/faq/',
            '/guides': '/guides/',
            '/privacy': '/privacy/',
            '/terms': '/terms/',
            '/m3u8-player': '/m3u8-player/',
          };
          for (const [sourcePath, canonicalPath] of Object.entries(slashRedirects)) {
            const response = await fetch(origin + sourcePath, {
              redirect: 'manual',
              headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(10000),
            });
            if (response.status !== 301) {
              throw new Error(sourcePath + ' must return HTTP 301, got ' + response.status);
            }
            const location = response.headers.get('location');
            const destination = location ? new URL(location, origin).toString() : '';
            if (destination !== origin + canonicalPath) {
              throw new Error(sourcePath + ' redirects to ' + destination + ' instead of ' + origin + canonicalPath);
            }
            if (sitemap.body.includes(origin + sourcePath + '</loc>')) {
              throw new Error('Non-canonical no-slash URL appears in sitemap: ' + sourcePath);
            }
          }

          // English support pages are indexable at clean trailing-slash URLs.
          const englishSupportPages = ['/about/', '/contact/', '/copyright/', '/docs/', '/faq/', '/guides/', '/privacy/', '/terms/'];
          for (const path of englishSupportPages) {
            const page = await get(path);
            if (!page.response.ok) throw new Error(path + ' returned HTTP ' + page.response.status);
            if (!page.body.includes('<html lang="en"')) throw new Error(path + ' is missing lang=en');
            const pageCanonical = page.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
            if (pageCanonical !== origin + path) throw new Error(path + ' has unexpected canonical: ' + pageCanonical);
            if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(page.body)) {
              throw new Error(path + ' unexpectedly carries noindex');
            }
            if (!sitemap.body.includes(origin + path + '</loc>')) throw new Error(path + ' is missing from sitemap.xml');
            const internalLegacyLinks = [...page.body.matchAll(/href=["']([^"']+)["']/g)]
              .map((match) => match[1])
              .filter((href) => {
                try {
                  const url = new URL(href, origin);
                  return url.origin === origin && /\.html(?:[?#].*)?$/i.test(url.pathname + url.search);
                } catch {
                  return false;
                }
              });
            if (internalLegacyLinks.length) {
              throw new Error(path + ' contains internal .html redirect links: ' + internalLegacyLinks.join(', '));
            }
            const slug = path.split('/')[1];
            if (!page.body.includes('href="/zh/' + slug + '/"')) {
              throw new Error(path + ' is missing its direct Chinese-language link');
            }
            if (!/<h1\b/i.test(page.body)) throw new Error(path + ' is missing its primary heading');
          }

          // Chinese support pages remain accessible for language-switch users, but stay noindex and outside the sitemap.
          const chineseIndex = await get('/zh/');
          if (!chineseIndex.response.ok || chineseIndex.response.url !== origin + '/zh/') {
            throw new Error('/zh/ did not resolve directly to HTTP 200');
          }
          if (!chineseIndex.body.includes('<html lang="zh-CN"') ||
              !/name=["']robots["'] content=["']noindex,\s*follow["']/i.test(chineseIndex.body)) {
            throw new Error('/zh/ must be Simplified Chinese and noindex, follow');
          }
          if (sitemap.body.includes(origin + '/zh/</loc>')) throw new Error('/zh/ must not appear in the indexable sitemap');

          const chineseSupportPages = ['/zh/about/','/zh/contact/','/zh/copyright/','/zh/docs/','/zh/faq/','/zh/guides/','/zh/privacy/','/zh/terms/'];
          for (const path of chineseSupportPages) {
            const page = await get(path);
            if (!page.response.ok || page.response.url !== origin + path) {
              throw new Error(path + ' must return directly as HTTP 200');
            }
            if (!page.body.includes('<html lang="zh-CN"') ||
                !/name=["']robots["'] content=["']noindex,\s*follow["']/i.test(page.body)) {
              throw new Error(path + ' must be Simplified Chinese and noindex, follow');
            }
            const canonical = page.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
            if (canonical !== origin + path) throw new Error(path + ' has unexpected canonical: ' + canonical);
            const slug = path.split('/')[2];
            if (!page.body.includes('href="/' + slug + '/" lang="en"')) {
              throw new Error(path + ' is missing its direct English-language link');
            }
            const internalLegacyLinks = [...page.body.matchAll(/href=["']([^"']+)["']/g)]
              .map((match) => match[1])
              .filter((href) => {
                try {
                  const url = new URL(href, origin);
                  return url.origin === origin && /\.html(?:[?#].*)?$/i.test(url.pathname + url.search);
                } catch {
                  return false;
                }
              });
            if (internalLegacyLinks.length) {
              throw new Error(path + ' contains internal .html links: ' + internalLegacyLinks.join(', '));
            }
            const localRefs = [...page.body.matchAll(/(?:href|src)=["']([^"']+)["']/g)].map((match) => match[1]);
            const relativeLocalRefs = localRefs.filter((ref) =>
              !/^(?:https?:|mailto:|tel:|data:)/i.test(ref) && !ref.startsWith('//') && !ref.startsWith('#') && !ref.startsWith('/')
            );
            if (relativeLocalRefs.length) {
              throw new Error(path + ' contains relative local asset/link paths: ' + relativeLocalRefs.join(', '));
            }
            if (sitemap.body.includes(origin + path + '</loc>')) {
              throw new Error(path + ' must remain outside sitemap.xml');
            }
          }

          // Nested Chinese routes must load shared assets from the site root, not their own subdirectory.
          for (const assetPath of ['/images/logo.png', '/images/logo.ico', '/css/style.css', '/css/dd-tokens.css', '/css/dd-shell.css']) {
            const asset = await fetch(origin + assetPath, {
              headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(10000),
            });
            if (!asset.ok) throw new Error(assetPath + ' returned HTTP ' + asset.status);
          }

          // Legacy .html URLs must resolve directly to the matching English canonical page.
          const legacyRoutes = {
            '/about.html': '/about/',
            '/contact.html': '/contact/',
            '/copyright.html': '/copyright/',
            '/docs.html': '/docs/',
            '/faq.html': '/faq/',
            '/guides.html': '/guides/',
            '/privacy.html': '/privacy/',
            '/terms.html': '/terms/',
          };
          for (const [legacyPath, canonicalPath] of Object.entries(legacyRoutes)) {
            const page = await get(legacyPath);
            if (!page.response.ok) throw new Error(legacyPath + ' did not resolve successfully (HTTP ' + page.response.status + ')');
            if (page.response.url !== origin + canonicalPath) {
              throw new Error(legacyPath + ' did not resolve to ' + canonicalPath + '; final URL: ' + page.response.url);
            }
            if (!page.body.includes('<html lang="en"')) {
              throw new Error(legacyPath + ' did not resolve to English HTML');
            }
            const canonical = page.body.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)/i)?.[1];
            if (canonical !== origin + canonicalPath) {
              throw new Error(legacyPath + ' resolved page has unexpected canonical: ' + canonical);
            }
            if (sitemap.body.includes(origin + legacyPath + '</loc>')) {
              throw new Error(legacyPath + ' must not appear in sitemap.xml');
            }
          }

          console.log('PASS: exact Cloudflare commit, CSP, iframe compatibility, English support pages, canonical URLs, sitemap and legacy-route consolidation');
          NODE